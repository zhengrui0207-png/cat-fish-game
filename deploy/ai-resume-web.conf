server {
    listen 80;
    server_name 8.141.101.70;

    client_max_body_size 20m;


    location = /homepage {
        return 301 /homepage/;
    }

    location ^~ /homepage/ {
        alias /var/www/zhengrui-homepage/current/;
        try_files $uri $uri/ /homepage/index.html;
    }


    location = /homepage-demo {
        return 301 /homepage-demo/;
    }

    location ^~ /homepage-demo/ {
        alias /var/www/zhengrui-homepage-demo/current/;
        try_files $uri $uri/ /homepage-demo/index.html;
    }

    location = /image-repair {
        return 301 /image-repair/;
    }

    location ^~ /image-repair/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /codex-course {
        return 301 /codex-course/;
    }

    location ^~ /codex-course/ {
        alias /var/www/image-repair-studio/codex-course/current/;
        index index.html;
    }



    location = /rental-dashboard {
        return 301 /rental-dashboard/;
    }

    location ^~ /rental-dashboard/ {
        alias /var/www/rental-dashboard/current/;
        index index.html;
        gzip_static on;
        gzip_vary on;
        try_files $uri $uri/ /rental-dashboard/index.html;
    }

    location = /xiaomao-zhuayu-3d-2026 {
        return 301 /xiaomao-zhuayu-3d-2026/;
    }

    location ^~ /xiaomao-zhuayu-3d-2026/ {
        alias /var/www/cat-fishing-3d/current/;
        index index.html;
        try_files $uri $uri/ /xiaomao-zhuayu-3d-2026/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
